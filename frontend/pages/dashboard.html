
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Quản lý kết quả học tập</title>

    <!-- CSS dùng chung theo thiết kế Figma -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body hidden>
    <div class="app-layout">

        <!-- THANH MENU BÊN TRÁI -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon">◆</div>

                <div>
                    <strong>HỆ THỐNG</strong>
                    <small>QUẢN LÝ KẾT QUẢ HỌC TẬP</small>
                </div>
            </div>


            <!-- Menu duoc tao tu JavaScript theo vai tro -->
            <nav id="sidebarNavigation"
                 class="sidebar-menu"
                 aria-label="Menu quản trị">
            </nav>


            <div class="sidebar-bottom">
                <a href="#" id="logoutLink">Đăng xuất</a>
            </div>
        </aside>

        <!-- KHU VỰC BÊN PHẢI -->
        <div class="main-content">

            <!-- HEADER -->
            <header class="topbar">
                <strong class="topbar-title">
                    HỆ THỐNG QUẢN LÝ KẾT QUẢ HỌC TẬP
                </strong>

                <div class="account-info">
                    <strong>Phòng Khảo thí</strong>
                    <span class="avatar">P</span>
                </div>
            </header>

            <main class="page-content">


                <!-- BỘ LỌC NIÊN KHÓA - KHỐI - LỚP -->
                <section class="stats-grid" aria-label="Thông tin tổng quan">

                    <!-- Niên khóa -->
                    <article class="stat-card">
                        <label class="stat-label" for="academicYear">
                            Niên khóa
                        </label>

                        <select id="academicYear" class="form-control">
                            <option value="2025-2026">
                                2025–2026
                            </option>

                            <option value="2026-2027" selected>
                                2026–2027
                            </option>
                        </select>
                    </article>

                    <!-- Khối học -->
                    <article class="stat-card">
                        <label class="stat-label" for="grade">
                            Khối học
                        </label>

                        <select id="grade" class="form-control">
                            <option value="10">Khối 10</option>
                            <option value="11">Khối 11</option>
                            <option value="12">Khối 12</option>
                        </select>
                    </article>

                    <!-- Lớp học -->
                    <article class="stat-card">
                        <label class="stat-label" for="classroom">
                            Lớp học
                        </label>

                        <select id="classroom" class="form-control">
                            <option value="">Chưa có lớp học</option>
                        </select>
                    </article>

                </section>

                <!-- THÔNG TIN LỰA CHỌN -->
                <div class="selection-summary" aria-live="polite">
                    Đang xem:
                    <strong id="selectedYear">2026–2027</strong>
                    –
                    <strong id="selectedGrade">Khối 10</strong>
                    –
                    <strong id="selectedClass">Chưa có lớp học</strong>

                    <!-- Hình minh họa Trang chủ -->
                    <section class="dashboard-illustration">
                        <img src="../images/dashboard-education-banner.png"
                             alt="Hệ thống quản lý kết quả học tập THPT">
                    </section>

                </div>

            </main>
        </div>
    </div>



    <!-- API client dung chung -->
    <script src="../js/api.js"></script>

    <!-- Menu theo vai tro -->
    <script src="../js/navigation.js"></script>

    <!-- Bo loc Dashboard cua Yen -->
    <script src="../js/dashboard.js"></script>

    <!-- Kiem tra phien va dang xuat -->
    <script src="../js/dashboard-auth.js"></script>

</body>
</html>
