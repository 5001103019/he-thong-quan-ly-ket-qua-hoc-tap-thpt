<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nhật ký kiểm toán (Audit Log) - Quản lý kết quả học tập</title>

    <!-- CSS dung chung -->
    <link rel="stylesheet" href="../css/style.css">
    <!-- CSS man hinh audit log -->
    <link rel="stylesheet" href="../css/audit-log.css">
</head>

<body hidden>
    <div class="app-layout">

        <!-- THANH MENU BEN TRAI -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon">◆</div>
                <div>
                    <strong>HỆ THỐNG</strong>
                    <small>QUẢN LÝ KẾT QUẢ HỌC TẬP</small>
                </div>
            </div>

            <!-- Menu duoc render tu JavaScript theo vai tro -->
            <nav id="sidebarNavigation"
                 class="sidebar-menu"
                 aria-label="Menu quản trị">
            </nav>

            <div class="sidebar-bottom">
                <a href="#">Cài đặt</a>
                <a href="#" id="logoutLink">Đăng xuất</a>
            </div>
        </aside>

        <!-- KHU VUC NOI DUNG CHINH -->
        <div class="main-content">

            <!-- HEADER DUNG CHUNG -->
            <header class="topbar">
                <strong class="topbar-title">
                    HỆ THỐNG QUẢN LÝ KẾT QUẢ HỌC TẬP
                </strong>

                <div class="account-info">
                    <strong>Phòng Khảo thí</strong>
                    <span class="avatar">P</span>
                </div>
            </header>

            <main class="page-content">

                <h1 class="page-title">
                    Nhật ký thao tác (Audit Log)
                </h1>

                <p class="page-description">
                    Theo dõi người thực hiện, thời gian, lý do và thay đổi trước/sau.
                </p>

                <!-- KHU VUC THONG BAO / ALERT -->
                <div id="alertContainer"></div>

                <!-- BỘ LỌC TÌM KIẾM NÂNG CAO (THỜI GIAN, NGƯỜI, CỘT, THAO TÁC) -->
                <section class="card" aria-label="Bộ lọc Audit Log">
                    <h2>Bộ lọc nhật ký</h2>

                    <!-- Dong 1: Thoi gian, Loai thao tac, Cot diem -->
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-top: 16px;">

                        <div class="form-group">
                            <label for="fromDateInput">Từ ngày</label>
                            <input type="date" id="fromDateInput" class="form-control">
                        </div>

                        <div class="form-group">
                            <label for="toDateInput">Đến ngày</label>
                            <input type="date" id="toDateInput" class="form-control">
                        </div>

                        <div class="form-group">
                            <label for="actionTypeSelect">Loại thao tác</label>
                            <select id="actionTypeSelect" class="form-control">
                                <option value="">-- Tất cả thao tác --</option>
                                <option value="LOCK">LOCK (Khóa điểm)</option>
                                <option value="UNLOCK">UNLOCK (Mở khóa)</option>
                                <option value="RELOCK">RELOCK (Khóa lại)</option>
                                <option value="SCORE_EDIT">SCORE_EDIT (Sửa điểm)</option>
                                <option value="SCORE_IMPORT">SCORE_IMPORT (Import CSV)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="componentSelect">Cột điểm</label>
                            <select id="componentSelect" class="form-control">
                                <option value="">-- Tất cả cột điểm --</option>
                                <option value="QT1">QT1 (Điểm quá trình 1)</option>
                                <option value="QT2">QT2 (Điểm quá trình 2)</option>
                                <option value="QT3">QT3 (Điểm quá trình 3)</option>
                                <option value="GK">GK (Điểm giữa kỳ)</option>
                                <option value="CK">CK (Điểm cuối kỳ)</option>
                            </select>
                        </div>

                    </div>

                    <!-- Dong 2: Nien khoa, Lop, Mon -->
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-top: 12px;">

                        <div class="form-group">
                            <label for="academicYearSelect">Niên khóa</label>
                            <select id="academicYearSelect" class="form-control">
                                <option value="">-- Tất cả niên khóa --</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="classSelect">Lớp học</label>
                            <select id="classSelect" class="form-control">
                                <option value="">-- Tất cả lớp --</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="subjectSelect">Môn học</label>
                            <select id="subjectSelect" class="form-control">
                                <option value="">-- Tất cả môn --</option>
                            </select>
                        </div>

                        <div class="form-group" style="display: flex; align-items: flex-end; gap: 8px;">
                            <button type="button" id="applyFilterBtn" class="btn btn-primary" style="flex: 1;">
                                Tìm kiếm
                            </button>
                            <button type="button" id="resetFilterBtn" class="btn btn-secondary">
                                Đặt lại
                            </button>
                        </div>

                    </div>
                </section>

                <!-- BẢNG LỊCH SỬ AUDIT LOG -->
                <section class="card" style="margin-top: 24px;" aria-label="Bảng dữ liệu Audit Log">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                        <h2 style="margin: 0;">Lịch sử kiểm toán</h2>
                        <span id="logSummaryLabel" style="font-size: 14px; color: #64748B;">
                            Đang tải dữ liệu...
                        </span>
                    </div>

                    <div id="auditLogTableContainer">
                        <div class="state-message">Đang tải nhật ký...</div>
                    </div>

                    <!-- ĐIỀU HƯỚNG PHÂN TRANG -->
                    <div class="pagination-controls">
                        <button type="button" id="prevPageBtn" class="pagination-btn" disabled>
                            &larr; Trang trước
                        </button>
                        <span id="pageIndicator" class="pagination-info">Trang 1 / 1</span>
                        <button type="button" id="nextPageBtn" class="pagination-btn" disabled>
                            Trang sau &rarr;
                        </button>
                    </div>
                </section>

            </main>
        </div>
    </div>

    <!-- JS dung chung cua he thong -->
    <script src="../js/api.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/dashboard-auth.js"></script>

    <!-- JS man hinh audit log -->
    <script src="../js/audit-log.js"></script>
</body>
</html>
